<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Players - SX Bans</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ===== ALL STYLES (همان استایل‌های dashboard با کمی تغییر) ===== */
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0a0a1a;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { width:6px; height:6px; }
        ::-webkit-scrollbar-track { background:#1a1a2e; }
        ::-webkit-scrollbar-thumb { background:#6c5ce7; border-radius:4px; }

        .glass-card {
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:16px;
            box-shadow:0 8px 32px rgba(0,0,0,0.2),inset 0 1px 0 rgba(255,255,255,0.1);
            transition:all 0.4s ease;
        }
        .glass-card:hover {
            background:rgba(255,255,255,0.06);
            border-color:rgba(108,92,231,0.3);
            box-shadow:0 12px 48px rgba(108,92,231,0.15);
            transform:translateY(-2px);
        }

        .app-container { display:flex; min-height:100vh; }

        /* Sidebar */
        .sidebar {
            width:220px;
            background:rgba(10,10,26,0.9);
            backdrop-filter:blur(20px);
            border-right:1px solid rgba(255,255,255,0.1);
            padding:20px 0;
            display:flex;
            flex-direction:column;
            position:fixed;
            top:0;
            left:0;
            bottom:0;
            z-index:100;
        }
        .sidebar-header { padding:0 20px 20px; border-bottom:1px solid rgba(255,255,255,0.1); }
        .logo-small { display:flex; align-items:center; gap:12px; font-size:20px; font-weight:800; color:#fff; }
        .logo-small i { color:#6c5ce7; font-size:24px; }

        .nav-menu { list-style:none; padding:16px 12px; flex:1; overflow-y:auto; }
        .nav-item { margin-bottom:4px; }
        .nav-item a {
            display:flex;
            align-items:center;
            gap:12px;
            padding:10px 14px;
            border-radius:12px;
            color:#8899aa;
            text-decoration:none;
            transition:0.3s;
            font-weight:500;
            font-size:14px;
        }
        .nav-item a i { width:20px; text-align:center; }
        .nav-item a:hover { background:rgba(108,92,231,0.1); color:#fff; }
        .nav-item.active a { background:rgba(108,92,231,0.2); color:#6c5ce7; }

        .sidebar-footer {
            padding:16px 20px;
            border-top:1px solid rgba(255,255,255,0.1);
        }
        .user-info { display:flex; align-items:center; gap:12px; }
        .user-avatar { width:36px; height:36px; border-radius:50%; border:2px solid #6c5ce7; }
        .user-name { font-size:14px; font-weight:600; }
        .user-level { font-size:12px; color:#8899aa; }
        .logout-btn {
            background:none;
            border:none;
            color:#8899aa;
            cursor:pointer;
            font-size:18px;
            padding:8px;
            border-radius:8px;
            margin-left:auto;
            transition:0.3s;
        }
        .logout-btn:hover { color:#e74c3c; background:rgba(231,76,60,0.1); }

        .main-content { margin-left:220px; flex:1; padding:20px; min-height:100vh; }

        .top-bar {
            padding:14px 20px;
            border-radius:16px;
            margin-bottom:20px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:12px;
            background:rgba(10,10,26,0.6);
            backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,0.1);
        }
        .page-title h2 { font-size:20px; font-weight:700; }
        .page-title .subtitle { font-size:13px; color:#8899aa; }
        .top-bar-actions { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }

        .search-box {
            display:flex;
            align-items:center;
            padding:0 14px;
            border-radius:12px;
            background:#1a1a2e;
            border:1px solid rgba(255,255,255,0.1);
        }
        .search-box i { color:#8899aa; font-size:14px; }
        .search-box input {
            background:none;
            border:none;
            padding:8px 10px;
            color:#fff;
            font-size:14px;
            width:160px;
            outline:none;
            font-family:inherit;
        }
        .search-box input::placeholder { color:#556677; }

        .btn-primary {
            background:linear-gradient(135deg,#6c5ce7,#5a4bd1);
            color:#fff;
            border:none;
            padding:8px 20px;
            border-radius:12px;
            font-size:14px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
            display:inline-flex;
            align-items:center;
            gap:6px;
        }
        .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(108,92,231,0.3); }
        .btn-secondary {
            background:rgba(255,255,255,0.05);
            color:#fff;
            border:1px solid rgba(255,255,255,0.1);
            padding:8px 20px;
            border-radius:12px;
            font-size:14px;
            font-weight:500;
            cursor:pointer;
            transition:0.3s;
            display:inline-flex;
            align-items:center;
            gap:6px;
        }
        .btn-secondary:hover { background:rgba(255,255,255,0.1); }

        .players-grid {
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
            gap:16px;
            margin-bottom:20px;
        }
        .player-card {
            padding:16px;
            cursor:pointer;
            background:rgba(255,255,255,0.05);
            border-radius:16px;
            border:1px solid rgba(255,255,255,0.1);
            transition:0.3s;
        }
        .player-card:hover { transform:translateY(-4px); }
        .player-head { position:relative; display:inline-block; }
        .player-avatar { width:56px; height:56px; border-radius:50%; border:2px solid rgba(255,255,255,0.1); }
        .player-status {
            position:absolute;
            bottom:0;
            right:0;
            width:18px;
            height:18px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:9px;
            border:2px solid #0a0a1a;
        }
        .player-status.clean { background:#00b894; }
        .player-status.banned { background:#e74c3c; }
        .player-status.muted { background:#f1c40f; }
        .player-info h4 { font-size:15px; font-weight:600; margin-top:8px; }
        .player-stats { display:flex; gap:10px; font-size:12px; color:#8899aa; }
        .player-stats span { display:flex; align-items:center; gap:3px; }
        .player-meta { display:flex; gap:10px; font-size:11px; color:#8899aa; margin-top:4px; }

        .pagination-container {
            display:flex;
            align-items:center;
            justify-content:center;
            gap:12px;
            padding:12px 0;
        }
        .page-btn {
            background:#1a1a2e;
            border:1px solid rgba(255,255,255,0.1);
            color:#fff;
            padding:6px 14px;
            border-radius:12px;
            cursor:pointer;
            transition:0.3s;
        }
        .page-btn:hover:not(:disabled) { background:#6c5ce7; }
        .page-btn:disabled { opacity:0.3; cursor:not-allowed; }
        .page-info { font-size:13px; color:#8899aa; }

        .loading-spinner {
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:40px;
            gap:10px;
        }
        .loading-spinner i { font-size:28px; color:#6c5ce7; }
        .loading-spinner span { color:#8899aa; font-size:13px; }

        .empty-state { padding:40px 20px; text-align:center; }
        .empty-state i { font-size:40px; color:#8899aa; margin-bottom:12px; }
        .empty-state h3 { font-size:18px; }

        /* ===== MODAL ===== */
        .modal-overlay {
            position:fixed;
            top:0;
            left:0;
            right:0;
            bottom:0;
            background:rgba(0,0,0,0.7);
            backdrop-filter:blur(10px);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:1000;
            padding:20px;
        }
        .modal-content {
            max-width:600px;
            width:100%;
            max-height:90vh;
            overflow-y:auto;
            padding:24px;
            background:#1a1a2e;
            border-radius:16px;
            border:1px solid rgba(255,255,255,0.1);
            position:relative;
        }
        .modal-close {
            position:absolute;
            top:12px;
            right:16px;
            background:none;
            border:none;
            color:#8899aa;
            font-size:20px;
            cursor:pointer;
            padding:4px 8px;
            border-radius:6px;
        }
        .modal-close:hover { color:#fff; background:rgba(255,255,255,0.05); }
        .modal-content h3 { font-size:18px; margin-bottom:16px; }

        .form-group { margin-bottom:14px; }
        .form-group label { display:block; font-size:13px; font-weight:500; margin-bottom:4px; color:#8899aa; }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width:100%;
            padding:10px 14px;
            border:1px solid rgba(255,255,255,0.1);
            border-radius:12px;
            background:#0a0a1a;
            color:#fff;
            font-size:14px;
            font-family:inherit;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline:none;
            border-color:#6c5ce7;
        }
        .form-group textarea { resize:vertical; min-height:60px; }

        @media (max-width:768px) {
            .sidebar { width:60px; }
            .sidebar .logo-small span,
            .sidebar .nav-item span,
            .sidebar .user-info>div,
            .sidebar .user-level { display:none; }
            .sidebar .logo-small { justify-content:center; }
            .sidebar .nav-item a { justify-content:center; padding:12px; }
            .main-content { margin-left:60px; padding:12px; }
            .top-bar { flex-direction:column; align-items:stretch; }
            .players-grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
            .modal-content { padding:16px; margin:10px; }
        }
        @media (max-width:480px) {
            .players-grid { grid-template-columns:1fr 1fr; gap:8px; }
            .player-card { padding:12px; }
            .player-avatar { width:44px; height:44px; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sidebar-header">
            <div class="logo-small">
                <i class="fas fa-shield-halved"></i>
                <span>SX Bans</span>
            </div>
        </div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="/dashboard"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a></li>
            <li class="nav-item active"><a href="/players"><i class="fas fa-users"></i><span>Players</span></a></li>
            <li class="nav-item"><a href="/history"><i class="fas fa-clock-rotate-left"></i><span>History</span></a></li>
            <li class="nav-item"><a href="/settings"><i class="fas fa-gear"></i><span>Settings</span></a></li>
        </ul>
        <div class="sidebar-footer">
            <div class="user-info">
                <img src="https://crafatar.com/avatars/{{uuid}}?size=32" alt="User" class="user-avatar">
                <div>
                    <span class="user-name">{{username}}</span>
                    <span class="user-level">Level {{user_level}}</span>
                </div>
            </div>
            <button onclick="logout()" class="logout-btn">
                <i class="fas fa-right-from-bracket"></i>
            </button>
        </div>
    </nav>

    <main class="main-content">
        <header class="top-bar">
            <div class="page-title">
                <h2>Players</h2>
                <span class="subtitle">Manage all players and their punishments</span>
            </div>
            <div class="top-bar-actions">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search players..." oninput="searchPlayers(this.value)">
                </div>
                <button class="btn-secondary" onclick="showAddPunishmentModal()">
                    <i class="fas fa-plus"></i> New Punishment
                </button>
            </div>
        </header>

        <section class="players-grid" id="playersGrid">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i>
                <span>Loading...</span>
            </div>
        </section>

        <div class="pagination-container" id="pagination">
            <button class="page-btn" onclick="changePage('prev')">
                <i class="fas fa-chevron-left"></i>
            </button>
            <span class="page-info" id="pageInfo">Page 1 of 1</span>
            <button class="page-btn" onclick="changePage('next')">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </main>
</div>

<!-- Player Modal -->
<div class="modal-overlay" id="playerModal" style="display:none;">
    <div class="modal-content" style="max-width:800px;">
        <button class="modal-close" onclick="closePlayerModal()"><i class="fas fa-times"></i></button>
        <div id="playerCardContent"><div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i></div></div>
    </div>
</div>

<!-- Add Punishment Modal -->
<div class="modal-overlay" id="punishmentModal" style="display:none;">
    <div class="modal-content">
        <button class="modal-close" onclick="closePunishmentModal()"><i class="fas fa-times"></i></button>
        <h3>Apply New Punishment</h3>
        <form id="punishmentForm">
            <div class="form-group">
                <label>Player Name</label>
                <input type="text" id="punishmentPlayer" required>
            </div>
            <div class="form-group">
                <label>Punishment Type</label>
                <select id="punishmentType" required>
                    <option value="BAN">Ban</option>
                    <option value="TEMP_BAN">Temporary Ban</option>
                    <option value="MUTE">Mute</option>
                    <option value="TEMP_MUTE">Temporary Mute</option>
                    <option value="WARN">Warning</option>
                    <option value="KICK">Kick</option>
                    <option value="IP_BAN">IP Ban</option>
                    <option value="IP_MUTE">IP Mute</option>
                    <option value="IP_KICK">IP Kick</option>
                </select>
            </div>
            <div class="form-group">
                <label>Duration</label>
                <input type="text" id="punishmentDuration" placeholder="e.g., 1d, 2h, 30m">
            </div>
            <div class="form-group">
                <label>Server (leave empty for global)</label>
                <input type="text" id="punishmentServer" placeholder="Server name">
            </div>
            <div class="form-group">
                <label>Reason</label>
                <textarea id="punishmentReason" required></textarea>
            </div>
            <button type="submit" class="btn-primary"><i class="fas fa-gavel"></i> Apply Punishment</button>
        </form>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login';
    let currentPage = 1, totalPages = 1, currentSearch = '';

    function logout() {
        localStorage.clear();
        window.location.href = '/login';
    }

    async function loadPlayers(page = 1, search = '') {
        try {
            const response = await fetch(`/api/players?page=${page}&limit=20&search=${encodeURIComponent(search)}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            if (data.success) {
                renderPlayers(data.players);
                currentPage = data.page;
                totalPages = data.totalPages;
                document.getElementById('pageInfo').textContent = `Page ${data.page} of ${data.totalPages}`;
                document.querySelector('.page-btn:first-child').disabled = data.page <= 1;
                document.querySelector('.page-btn:last-child').disabled = data.page >= data.totalPages;
            }
        } catch (error) {
            console.error('Error loading players:', error);
        }
    }

    function renderPlayers(players) {
        const grid = document.getElementById('playersGrid');
        if (!players || players.length === 0) {
            grid.innerHTML = `<div class="empty-state"><i class="fas fa-users-slash"></i><h3>No Players Found</h3></div>`;
            return;
        }
        grid.innerHTML = players.map(player => `
            <div class="player-card" onclick="showPlayer('${player.name}')">
                <div class="player-head">
                    <img src="${player.headUrl}" alt="${player.name}" class="player-avatar">
                    <div class="player-status ${player.isBanned ? 'banned' : player.isMuted ? 'muted' : 'clean'}">
                        <i class="fas fa-${player.isBanned ? 'ban' : player.isMuted ? 'volume-xmark' : 'check'}"></i>
                    </div>
                </div>
                <div class="player-info">
                    <h4>${player.name}</h4>
                    <div class="player-stats">
                        <span><i class="fas fa-gavel"></i> ${player.totalPunishments}</span>
                        <span><i class="fas fa-triangle-exclamation"></i> ${player.warnings}</span>
                    </div>
                    <div class="player-meta">
                        <span><i class="fas fa-globe"></i> ${player.ip || 'Unknown'}</span>
                        <span><i class="fas fa-clock"></i> ${player.lastPunishment ? new Date(player.lastPunishment).toLocaleDateString() : '-'}</span>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function changePage(direction) {
        if (direction === 'prev' && currentPage > 1) loadPlayers(currentPage - 1, currentSearch);
        else if (direction === 'next' && currentPage < totalPages) loadPlayers(currentPage + 1, currentSearch);
    }

    function searchPlayers(query) { currentSearch = query; loadPlayers(1, query); }

    async function showPlayer(playerName) {
        const modal = document.getElementById('playerModal');
        const content = document.getElementById('playerCardContent');
        modal.style.display = 'flex';
        content.innerHTML = `<div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i></div>`;

        try {
            const response = await fetch(`/api/players/${encodeURIComponent(playerName)}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            if (data.success) {
                const p = data;
                content.innerHTML = `
                    <div style="padding:20px;">
                        <div style="display:flex;align-items:center;gap:20px;margin-bottom:20px;flex-wrap:wrap;">
                            <img src="${p.headUrl}" alt="${p.name}" style="width:80px;height:80px;border-radius:50%;border:3px solid rgba(255,255,255,0.2);">
                            <div style="flex:1;">
                                <h2 style="margin:0;">${p.name}</h2>
                                <span style="color:rgba(255,255,255,0.6);font-size:12px;font-family:monospace;">${p.uuid}</span>
                                <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;">
                                    ${p.isBanned ? '<span style="padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600;background:rgba(231,76,60,0.2);color:#e74c3c;">Banned</span>' : ''}
                                    ${p.isMuted ? '<span style="padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600;background:rgba(241,196,15,0.2);color:#f1c40f;">Muted</span>' : ''}
                                    ${p.isOnline ? '<span style="padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600;background:rgba(0,184,148,0.2);color:#00b894;">Online</span>' : '<span style="padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600;background:rgba(136,153,170,0.2);color:#8899aa;">Offline</span>'}
                                </div>
                            </div>
                            <button onclick="closePlayerModal()" style="background:none;border:none;color:#fff;font-size:24px;cursor:pointer;">&times;</button>
                        </div>
                        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;">
                            <div style="text-align:center;padding:10px;background:rgba(255,255,255,0.05);border-radius:12px;">
                                <div style="font-size:11px;color:#8899aa;">Total</div>
                                <div style="font-size:20px;font-weight:700;">${p.totalPunishments}</div>
                            </div>
                            <div style="text-align:center;padding:10px;background:rgba(255,255,255,0.05);border-radius:12px;">
                                <div style="font-size:11px;color:#8899aa;">Bans</div>
                                <div style="font-size:20px;font-weight:700;color:#e74c3c;">${p.banCount||0}</div>
                            </div>
                            <div style="text-align:center;padding:10px;background:rgba(255,255,255,0.05);border-radius:12px;">
                                <div style="font-size:11px;color:#8899aa;">Mutes</div>
                                <div style="font-size:20px;font-weight:700;color:#f1c40f;">${p.muteCount||0}</div>
                            </div>
                            <div style="text-align:center;padding:10px;background:rgba(255,255,255,0.05);border-radius:12px;">
                                <div style="font-size:11px;color:#8899aa;">Warnings</div>
                                <div style="font-size:20px;font-weight:700;color:#3498db;">${p.warnCount||0}</div>
                            </div>
                        </div>
                        <div style="background:rgba(255,255,255,0.05);border-radius:12px;padding:16px;margin-bottom:12px;">
                            <h4 style="margin-bottom:8px;"><i class="fas fa-globe"></i> IP Information</h4>
                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px;">
                                <span><strong>IP:</strong> ${p.ip || 'Unknown'}</span>
                                ${p.ipCountry ? `<span><strong>Country:</strong> ${p.ipCountry}</span>` : ''}
                                ${p.ipCity ? `<span><strong>City:</strong> ${p.ipCity}</span>` : ''}
                                ${p.ipPlayerCount ? `<span><strong>Players on IP:</strong> ${p.ipPlayerCount}</span>` : ''}
                            </div>
                        </div>
                        <div style="background:rgba(255,255,255,0.05);border-radius:12px;padding:16px;margin-bottom:12px;">
                            <h4 style="margin-bottom:8px;"><i class="fas fa-gavel"></i> Active Punishments</h4>
                            ${p.activePunishments && p.activePunishments.length > 0 ?
                                p.activePunishments.map(pun => `
                                    <div style="display:flex;align-items:center;gap:10px;padding:6px 10px;background:rgba(255,255,255,0.03);border-radius:8px;margin-bottom:4px;flex-wrap:wrap;">
                                        <span class="type-badge type-${pun.type}">${pun.type}</span>
                                        <span style="flex:1;font-size:13px;">${pun.reason}</span>
                                        <span style="color:#8899aa;font-size:12px;">${pun.timeRemaining || 'Permanent'}</span>
                                    </div>
                                `).join('') :
                                '<span style="color:#8899aa;">No active punishments</span>'
                            }
                        </div>
                        <div style="background:rgba(255,255,255,0.05);border-radius:12px;padding:16px;">
                            <h4 style="margin-bottom:8px;"><i class="fas fa-clock-rotate-left"></i> History</h4>
                            ${p.punishments && p.punishments.length > 0 ?
                                p.punishments.slice(0,10).map(pun => `
                                    <div style="display:flex;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.03);font-size:12px;flex-wrap:wrap;">
                                        <span class="type-badge type-${pun.type}" style="font-size:9px;padding:2px 8px;">${pun.type}</span>
                                        <span style="flex:1;color:#8899aa;">${pun.reason}</span>
                                        <span style="color:#8899aa;">${pun.executorName || 'Unknown'}</span>
                                        <span style="color:#556677;">${pun.createdAt ? new Date(pun.createdAt).toLocaleDateString() : '-'}</span>
                                        <span class="status-badge status-${pun.status}" style="font-size:9px;padding:2px 8px;">${pun.status}</span>
                                    </div>
                                `).join('') :
                                '<span style="color:#8899aa;">No history</span>'
                            }
                        </div>
                    </div>
                `;
            }
        } catch (error) { content.innerHTML = '<p style="color:#e74c3c;text-align:center;padding:20px;">Error loading player data</p>'; }
    }

    function closePlayerModal() { document.getElementById('playerModal').style.display = 'none'; }
    function showAddPunishmentModal() { document.getElementById('punishmentModal').style.display = 'flex'; }
    function closePunishmentModal() { document.getElementById('punishmentModal').style.display = 'none'; }

    document.getElementById('punishmentForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        try {
            const response = await fetch('/api/punishments', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    player: document.getElementById('punishmentPlayer').value,
                    type: document.getElementById('punishmentType').value,
                    duration: document.getElementById('punishmentDuration').value || '-1',
                    server: document.getElementById('punishmentServer').value,
                    reason: document.getElementById('punishmentReason').value
                })
            });
            const data = await response.json();
            if (data.success) { closePunishmentModal(); loadPlayers(currentPage, currentSearch); alert('Punishment applied!'); }
            else alert('Error: ' + data.message);
        } catch (error) { alert('Connection error'); }
    });

    document.addEventListener('DOMContentLoaded', () => loadPlayers());
</script>
</body>
</html>
