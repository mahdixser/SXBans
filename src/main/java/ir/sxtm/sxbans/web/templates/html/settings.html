<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - SX Bans</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0a0a1a;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { width:6px; height:6px; }
        ::-webkit-scrollbar-track { background:#1a1a2e; }
        ::-webkit-scrollbar-thumb { background:#6c5ce7; border-radius:4px; }

        .glass-card {
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:16px;
            box-shadow:0 8px 32px rgba(0,0,0,0.2),inset 0 1px 0 rgba(255,255,255,0.1);
            transition:all 0.4s ease;
        }
        .glass-card:hover {
            background:rgba(255,255,255,0.06);
            border-color:rgba(108,92,231,0.3);
            box-shadow:0 12px 48px rgba(108,92,231,0.15);
            transform:translateY(-2px);
        }

        .app-container { display:flex; min-height:100vh; }

        .sidebar {
            width:220px;
            background:rgba(10,10,26,0.9);
            backdrop-filter:blur(20px);
            border-right:1px solid rgba(255,255,255,0.1);
            padding:20px 0;
            display:flex;
            flex-direction:column;
            position:fixed;
            top:0;
            left:0;
            bottom:0;
            z-index:100;
        }
        .sidebar-header { padding:0 20px 20px; border-bottom:1px solid rgba(255,255,255,0.1); }
        .logo-small { display:flex; align-items:center; gap:12px; font-size:20px; font-weight:800; color:#fff; }
        .logo-small i { color:#6c5ce7; font-size:24px; }

        .nav-menu { list-style:none; padding:16px 12px; flex:1; overflow-y:auto; }
        .nav-item { margin-bottom:4px; }
        .nav-item a {
            display:flex;
            align-items:center;
            gap:12px;
            padding:10px 14px;
            border-radius:12px;
            color:#8899aa;
            text-decoration:none;
            transition:0.3s;
            font-weight:500;
            font-size:14px;
        }
        .nav-item a i { width:20px; text-align:center; }
        .nav-item a:hover { background:rgba(108,92,231,0.1); color:#fff; }
        .nav-item.active a { background:rgba(108,92,231,0.2); color:#6c5ce7; }

        .sidebar-footer {
            padding:16px 20px;
            border-top:1px solid rgba(255,255,255,0.1);
        }
        .user-info { display:flex; align-items:center; gap:12px; }
        .user-avatar { width:36px; height:36px; border-radius:50%; border:2px solid #6c5ce7; }
        .user-name { font-size:14px; font-weight:600; }
        .user-level { font-size:12px; color:#8899aa; }
        .logout-btn {
            background:none;
            border:none;
            color:#8899aa;
            cursor:pointer;
            font-size:18px;
            padding:8px;
            border-radius:8px;
            margin-left:auto;
            transition:0.3s;
        }
        .logout-btn:hover { color:#e74c3c; background:rgba(231,76,60,0.1); }

        .main-content { margin-left:220px; flex:1; padding:20px; min-height:100vh; }

        .top-bar {
            padding:14px 20px;
            border-radius:16px;
            margin-bottom:20px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:12px;
            background:rgba(10,10,26,0.6);
            backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,0.1);
        }
        .page-title h2 { font-size:20px; font-weight:700; }
        .page-title .subtitle { font-size:13px; color:#8899aa; }
        .top-bar-actions { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }

        .btn-primary {
            background:linear-gradient(135deg,#6c5ce7,#5a4bd1);
            color:#fff;
            border:none;
            padding:8px 20px;
            border-radius:12px;
            font-size:14px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
            display:inline-flex;
            align-items:center;
            gap:6px;
        }
        .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(108,92,231,0.3); }
        .btn-secondary {
            background:rgba(255,255,255,0.05);
            color:#fff;
            border:1px solid rgba(255,255,255,0.1);
            padding:8px 20px;
            border-radius:12px;
            font-size:14px;
            font-weight:500;
            cursor:pointer;
            transition:0.3s;
            display:inline-flex;
            align-items:center;
            gap:6px;
        }
        .btn-secondary:hover { background:rgba(255,255,255,0.1); }

        .settings-container { display:grid; grid-template-columns:200px 1fr; gap:20px; }
        .settings-tabs { display:flex; flex-direction:column; gap:4px; }
        .tab-btn {
            background:none;
            border:none;
            color:#8899aa;
            padding:12px 16px;
            border-radius:12px;
            text-align:left;
            font-size:14px;
            font-weight:500;
            cursor:pointer;
            transition:0.3s;
            display:flex;
            align-items:center;
            gap:12px;
        }
        .tab-btn:hover { background:rgba(255,255,255,0.05); color:#fff; }
        .tab-btn.active { background:rgba(108,92,231,0.2); color:#6c5ce7; }
        .tab-content { display:none; }
        .tab-content.active { display:block; }

        .settings-group {
            padding:20px;
            margin-bottom:16px;
            background:rgba(255,255,255,0.05);
            border-radius:16px;
            border:1px solid rgba(255,255,255,0.1);
        }
        .settings-group h3 { font-size:18px; margin-bottom:16px; }

        .setting-item {
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:10px 0;
            border-bottom:1px solid rgba(255,255,255,0.05);
        }
        .setting-item:last-child { border-bottom:none; }
        .setting-item label { font-size:14px; font-weight:500; }
        .setting-item input[type="checkbox"] {
            width:20px;
            height:20px;
            accent-color:#6c5ce7;
            cursor:pointer;
        }
        .setting-item input[type="text"],
        .setting-item input[type="number"],
        .setting-item select {
            background:#0a0a1a;
            border:1px solid rgba(255,255,255,0.1);
            border-radius:8px;
            padding:8px 12px;
            color:#fff;
            font-size:14px;
            width:200px;
            font-family:inherit;
        }
        .setting-item input:focus,
        .setting-item select:focus { outline:none; border-color:#6c5ce7; }

        .users-header {
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:16px;
        }
        .users-header h3 { font-size:18px; }

        .user-item {
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:12px 16px;
            margin-bottom:8px;
            background:rgba(255,255,255,0.05);
            border-radius:12px;
        }
        .user-level-badge {
            font-size:12px;
            color:#8899aa;
            background:rgba(255,255,255,0.05);
            padding:2px 10px;
            border-radius:12px;
        }
        .badge {
            padding:2px 10px;
            border-radius:12px;
            font-size:11px;
            font-weight:600;
        }
        .badge-success { background:rgba(0,184,148,0.2); color:#00b894; }
        .badge-danger { background:rgba(231,76,60,0.2); color:#e74c3c; }

        .modal-overlay {
            position:fixed;
            top:0;
            left:0;
            right:0;
            bottom:0;
            background:rgba(0,0,0,0.7);
            backdrop-filter:blur(10px);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:1000;
            padding:20px;
        }
        .modal-content {
            max-width:500px;
            width:100%;
            max-height:90vh;
            overflow-y:auto;
            padding:24px;
            background:#1a1a2e;
            border-radius:16px;
            border:1px solid rgba(255,255,255,0.1);
            position:relative;
        }
        .modal-close {
            position:absolute;
            top:12px;
            right:16px;
            background:none;
            border:none;
            color:#8899aa;
            font-size:20px;
            cursor:pointer;
            padding:4px 8px;
            border-radius:6px;
        }
        .modal-close:hover { color:#fff; background:rgba(255,255,255,0.05); }
        .modal-content h3 { font-size:18px; margin-bottom:16px; }

        .form-group { margin-bottom:14px; }
        .form-group label { display:block; font-size:13px; font-weight:500; margin-bottom:4px; color:#8899aa; }
        .form-group input,
        .form-group select {
            width:100%;
            padding:10px 14px;
            border:1px solid rgba(255,255,255,0.1);
            border-radius:12px;
            background:#0a0a1a;
            color:#fff;
            font-size:14px;
            font-family:inherit;
        }
        .form-group input:focus,
        .form-group select:focus { outline:none; border-color:#6c5ce7; }

        .loading-spinner {
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:40px;
            gap:10px;
        }
        .loading-spinner i { font-size:28px; color:#6c5ce7; }
        .loading-spinner span { color:#8899aa; font-size:13px; }

        .empty-state { padding:40px 20px; text-align:center; }
        .empty-state i { font-size:40px; color:#8899aa; margin-bottom:12px; }
        .empty-state h3 { font-size:18px; }

        @media (max-width:768px) {
            .sidebar { width:60px; }
            .sidebar .logo-small span,
            .sidebar .nav-item span,
            .sidebar .user-info>div,
            .sidebar .user-level { display:none; }
            .sidebar .logo-small { justify-content:center; }
            .sidebar .nav-item a { justify-content:center; padding:12px; }
            .main-content { margin-left:60px; padding:12px; }
            .top-bar { flex-direction:column; align-items:stretch; }
            .settings-container { grid-template-columns:1fr; }
            .settings-tabs { flex-direction:row; flex-wrap:wrap; }
            .setting-item { flex-direction:column; align-items:stretch; gap:6px; }
            .setting-item input[type="text"],
            .setting-item input[type="number"],
            .setting-item select { width:100%; }
        }
        @media (max-width:480px) {
            .modal-content { padding:16px; margin:10px; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <nav class="sidebar">
        <div class="sidebar-header">
            <div class="logo-small">
                <i class="fas fa-shield-halved"></i>
                <span>SX Bans</span>
            </div>
        </div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="/dashboard"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a></li>
            <li class="nav-item"><a href="/players"><i class="fas fa-users"></i><span>Players</span></a></li>
            <li class="nav-item"><a href="/history"><i class="fas fa-clock-rotate-left"></i><span>History</span></a></li>
            <li class="nav-item active"><a href="/settings"><i class="fas fa-gear"></i><span>Settings</span></a></li>
        </ul>
        <div class="sidebar-footer">
            <div class="user-info">
                <img src="https://minotar.net/avatar/00000000-0000-0000-0000-000000000000/32" alt="User" class="user-avatar" id="sidebarAvatar">
                <div>
                    <span class="user-name" id="sidebarUsername">{{username}}</span>
                    <span class="user-level">Level {{user_level}}</span>
                </div>
            </div>
            <button onclick="logout()" class="logout-btn">
                <i class="fas fa-right-from-bracket"></i>
            </button>
        </div>
    </nav>

    <main class="main-content">
        <header class="top-bar">
            <div class="page-title">
                <h2>Settings</h2>
                <span class="subtitle">Configure SX Bans system settings</span>
            </div>
            <div class="top-bar-actions">
                <button class="btn-secondary" onclick="reloadConfig()"><i class="fas fa-rotate"></i> Reload</button>
                <button class="btn-primary" onclick="saveSettings()"><i class="fas fa-save"></i> Save</button>
            </div>
        </header>

        <div class="settings-container">
            <div class="settings-tabs">
                <button class="tab-btn active" onclick="switchTab('general')"><i class="fas fa-sliders"></i> General</button>
                <button class="tab-btn" onclick="switchTab('web')"><i class="fas fa-globe"></i> Web</button>
                <button class="tab-btn" onclick="switchTab('database')"><i class="fas fa-database"></i> Database</button>
                <button class="tab-btn" onclick="switchTab('users')"><i class="fas fa-users-cog"></i> Users</button>
            </div>

            <div class="settings-content">
                <div id="tab-general" class="tab-content active">
                    <div class="settings-group">
                        <h3>General Settings</h3>
                        <div class="setting-item"><label>Max Warnings</label><input type="number" id="maxWarnings" value="5"></div>
                        <div class="setting-item"><label>Auto-Ban Enabled</label><input type="checkbox" id="autoBanEnabled" checked></div>
                        <div class="setting-item"><label>Auto-Ban Duration (hours)</label><input type="number" id="autoBanDuration" value="24"></div>
                    </div>
                </div>

                <div id="tab-web" class="tab-content">
                    <div class="settings-group">
                        <h3>Web Server</h3>
                        <div class="setting-item"><label>Enabled</label><input type="checkbox" id="webEnabled" checked></div>
                        <div class="setting-item"><label>Port</label><input type="number" id="webPort" value="8080"></div>
                        <div class="setting-item"><label>Host</label><input type="text" id="webHost" value="0.0.0.0"></div>
                    </div>
                </div>

                <div id="tab-database" class="tab-content">
                    <div class="settings-group">
                        <h3>Database</h3>
                        <div class="setting-item"><label>Type</label>
                            <select id="dbType"><option value="json">JSON</option><option value="mysql">MySQL</option><option value="sqlite">SQLite</option></select>
                        </div>
                        <div class="setting-item"><label>Host</label><input type="text" id="dbHost" value="localhost"></div>
                        <div class="setting-item"><label>Port</label><input type="number" id="dbPort" value="3306"></div>
                        <div class="setting-item"><label>Name</label><input type="text" id="dbName" value="sxbans"></div>
                    </div>
                </div>

                <div id="tab-users" class="tab-content">
                    <div class="settings-group">
                        <div class="users-header">
                            <h3>Web Users</h3>
                            <button class="btn-secondary" onclick="showAddUserModal()"><i class="fas fa-plus"></i> Add</button>
                        </div>
                        <div class="users-list" id="usersList">
                            <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i><span>Loading...</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<div class="modal-overlay" id="addUserModal" style="display:none;">
    <div class="modal-content">
        <button class="modal-close" onclick="closeAddUserModal()"><i class="fas fa-times"></i></button>
        <h3>Add Web User</h3>
        <form id="addUserForm">
            <div class="form-group"><label>Username</label><input type="text" id="newUsername" required></div>
            <div class="form-group"><label>Password</label><input type="password" id="newPassword" required></div>
            <div class="form-group"><label>Level</label><input type="number" id="newLevel" value="1"></div>
            <button type="submit" class="btn-primary"><i class="fas fa-user-plus"></i> Create</button>
        </form>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login';

    function updateSidebarAvatar() {
        const avatar = document.getElementById('sidebarAvatar');
        const nameEl = document.getElementById('sidebarUsername');
        const username = localStorage.getItem('username') || 'Admin';

        if (avatar) {
            avatar.src = 'https://minotar.net/avatar/00000000-0000-0000-0000-000000000000/32';
        }
        if (nameEl) {
            nameEl.textContent = username;
        }
    }

    function logout() { localStorage.clear(); window.location.href = '/login'; }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.tab-btn[onclick="switchTab('${tab}')"]`).classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById(`tab-${tab}`).classList.add('active');
    }

    async function loadSettings() {
        try {
            const response = await fetch('/api/settings', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await response.json();
            if (data) {
                document.getElementById('maxWarnings').value = data.maxWarnings || 5;
                document.getElementById('autoBanEnabled').checked = data.autoBanEnabled || false;
                document.getElementById('autoBanDuration').value = data.autoBanDuration ? data.autoBanDuration/3600000 : 24;
                document.getElementById('webEnabled').checked = data.webEnabled || false;
                document.getElementById('webPort').value = data.webPort || 8080;
                document.getElementById('webHost').value = data.webHost || '0.0.0.0';
                document.getElementById('dbType').value = data.databaseType || 'json';
                document.getElementById('dbHost').value = data.databaseHost || 'localhost';
                document.getElementById('dbPort').value = data.databasePort || 3306;
                document.getElementById('dbName').value = data.databaseName || 'sxbans';
            }
        } catch (error) { console.error('Error loading settings:', error); }
    }

    async function saveSettings() {
        const settings = {
            maxWarnings: parseInt(document.getElementById('maxWarnings').value),
            autoBanEnabled: document.getElementById('autoBanEnabled').checked,
            autoBanDuration: parseInt(document.getElementById('autoBanDuration').value) * 3600000,
            webEnabled: document.getElementById('webEnabled').checked,
            webPort: parseInt(document.getElementById('webPort').value),
            webHost: document.getElementById('webHost').value,
            databaseType: document.getElementById('dbType').value,
            databaseHost: document.getElementById('dbHost').value,
            databasePort: parseInt(document.getElementById('dbPort').value),
            databaseName: document.getElementById('dbName').value
        };
        try {
            const response = await fetch('/api/settings', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(settings)
            });
            const data = await response.json();
            alert(data.success ? 'Settings saved!' : 'Error: ' + data.message);
        } catch (error) { alert('Connection error'); }
    }

    async function reloadConfig() {
        try {
            const response = await fetch('/api/settings/reload', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            if (data.success) { alert('Reloaded!'); loadSettings(); }
            else alert('Error: ' + data.message);
        } catch (error) { alert('Connection error'); }
    }

    async function loadUsers() {
        try {
            const response = await fetch('/api/settings/users', { headers: { 'Authorization': `Bearer ${token}` } });
            const users = await response.json();
            const container = document.getElementById('usersList');
            if (!users || users.length === 0) { container.innerHTML = '<div class="empty-state"><i class="fas fa-users-slash"></i><h3>No users</h3></div>'; return; }
            container.innerHTML = users.map(u => `
                <div class="user-item">
                    <div>
                        <span class="username">${u.username}</span>
                        <span class="user-level-badge">Level ${u.level}</span>
                        ${u.enabled ? '<span class="badge badge-success">Enabled</span>' : '<span class="badge badge-danger">Disabled</span>'}
                    </div>
                    ${u.username !== 'admin' ? `<div><button onclick="deleteUser('${u.username}')" style="background:none;border:none;color:#e74c3c;cursor:pointer;"><i class="fas fa-trash"></i></button></div>` : ''}
                </div>
            `).join('');
        } catch (error) { console.error('Error loading users:', error); }
    }

    function showAddUserModal() { document.getElementById('addUserModal').style.display = 'flex'; }
    function closeAddUserModal() { document.getElementById('addUserModal').style.display = 'none'; }

    document.getElementById('addUserForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        try {
            const response = await fetch('/api/settings/users', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('newUsername').value,
                    password: document.getElementById('newPassword').value,
                    level: parseInt(document.getElementById('newLevel').value)
                })
            });
            const data = await response.json();
            if (data.success) { closeAddUserModal(); loadUsers(); alert('User created!'); }
            else alert('Error: ' + data.message);
        } catch (error) { alert('Connection error'); }
    });

    async function deleteUser(username) {
        if (!confirm(`Delete ${username}?`)) return;
        try {
            const response = await fetch(`/api/settings/users/${username}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            if (data.success) { loadUsers(); }
            else alert('Error: ' + data.message);
        } catch (error) { alert('Connection error'); }
    }

    document.addEventListener('DOMContentLoaded', () => {
        updateSidebarAvatar();
        loadSettings();
        loadUsers();
    });
</script>
</body>
</html>
