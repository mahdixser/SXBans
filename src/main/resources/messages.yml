# SX Bans Messages Configuration
# All messages are customizable with color codes (&)
# Support for hover messages with &h format

# -------------------------------------------------------------------
# PREFIX
# -------------------------------------------------------------------
prefix: '&8[&6SXBans&8] &7'

# -------------------------------------------------------------------
# BROADCAST MESSAGES WITH HOVER SUPPORT & PERMISSION
# -------------------------------------------------------------------
broadcast:
  ban:
    message: '&c&l%player% &7ʜᴀs ʙᴇᴇɴ &c&lʙᴀɴɴᴇᴅ'
    broadcast_to_everyone: false
    permission: 'sxbans.admin.punishview.ban'
    hover:
      - '&c&lᴘʟᴀʏᴇʀ ʙᴀɴɴᴇᴅ!'
      - '&c👤 &fᴘʟᴀʏᴇʀ &8→ &c%player%'
      - '&c✎ &fʀᴇᴀsᴏɴ &8→ &c%reason%'
      - '&c🛠 &fᴘᴜɴɪsʜᴇᴅ ʙʏ &8→ &c%executor%'

  tempban:
    message: '&c&l%player% &7ʜᴀs ʙᴇᴇɴ &c&lᴛᴇᴍᴘ-ʙᴀɴɴᴇᴅ'
    broadcast_to_everyone: true
    permission: 'sxbans.admin.punishview.tempban'
    hover:
      - '&c&lᴘʟᴀʏᴇʀ ᴛᴇᴍᴘᴏʀᴀʀɪʟʏ ʙᴀɴɴᴇᴅ!'
      - '&c👤 &fᴘʟᴀʏᴇʀ &8→ &c%player%'
      - '&c✎ &fʀᴇᴀsᴏɴ &8→ &c%reason%'
      - '&c⌚ &fᴅᴜʀᴀᴛɪᴏɴ &8→ &c%duration%'
      - '&c🛠 &fᴘᴜɴɪsʜᴇᴅ ʙʏ &8→ &c%executor%'

  unban:
    message: '&c&l%player%&7''s &c&lʙᴀɴ &7ʜᴀs ʙᴇᴇɴ &a&lʀᴇᴠᴏᴋᴇᴅ'
    broadcast_to_everyone: true
    permission: 'sxbans.admin.punishview.unban'
    hover:
      - '&c&lᴘʟᴀʏᴇʀ ᴜɴ-ʙᴀɴɴᴇᴅ!'
      - '&c👤 &fᴘʟᴀʏᴇʀ &8→ &c%player%'
      - '&c✎ &fʀᴇᴀsᴏɴ &8→ &c%reason%'
      - '&c🛠 &fʀᴇᴠᴏᴋᴇᴅ ʙʏ &8→ &c%executor%'

  mute:
    message: '&c&l%player% &7ʜᴀs ʙᴇᴇɴ &c&lᴍᴜᴛᴇᴅ'
    broadcast_to_everyone: false
    permission: 'sxbans.admin.punishview.mute'
    hover:
      - '&c&lᴘʟᴀʏᴇʀ ᴍᴜᴛᴇᴅ!'
      - '&c👤 &fᴘʟᴀʏᴇʀ &8→ &c%player%'
      - '&c✎ &fʀᴇᴀsᴏɴ &8→ &c%reason%'
      - '&c🛠 &fᴍᴜᴛᴇᴅ ʙʏ &8→ &c%executor%'

  tempmute:
    message: '&c&l%player% &7ʜᴀs ʙᴇᴇɴ &c&lᴛᴇᴍᴘ-ᴍᴜᴛᴇᴅ'
    broadcast_to_everyone: true
    permission: 'sxbans.admin.punishview.tempmute'
    hover:
      - '&c&lᴘʟᴀʏᴇʀ ᴛᴇᴍᴘᴏʀᴀʀɪʟʏ ᴍᴜᴛᴇᴅ!'
      - '&c👤 &fᴘʟᴀʏᴇʀ &8→ &c%player%'
      - '&c✎ &fʀᴇᴀsᴏɴ &8→ &c%reason%'
      - '&c⌚ &fᴅᴜʀᴀᴛɪᴏɴ &8→ &c%duration%'
      - '&c🛠 &fᴍᴜᴛᴇᴅ ʙʏ &8→ &c%executor%'

  unmute:
    message: '&c&l%player% &7ʜᴀs ʙᴇᴇɴ &c&lᴜɴ-ᴍᴜᴛᴇᴅ'
    broadcast_to_everyone: true
    permission: 'sxbans.admin.punishview.unmute'
    hover:
      - '&c&lᴘʟᴀʏᴇʀ ᴜɴ-ᴍᴜᴛᴇᴅ!'
      - '&c👤 &fᴘʟᴀʏᴇʀ &8→ &c%player%'
      - '&c✎ &fʀᴇᴀsᴏɴ &8→ &c%reason%'
      - '&c🛠 &fᴜɴᴍᴜᴛᴇᴅ ʙʏ &8→ &c%executor%'

  kick:
    message: '&c&l%player% &7ʜᴀs ʙᴇᴇɴ &c&lᴋɪᴄᴋᴇᴅ'
    broadcast_to_everyone: false
    permission: 'sxbans.admin.punishview.kick'
    hover:
      - '&c&lᴘʟᴀʏᴇʀ ᴋɪᴄᴋᴇᴅ!'
      - '&c👤 &fᴘʟᴀʏᴇʀ &8→ &c%player%'
      - '&c✎ &fʀᴇᴀsᴏɴ &8→ &c%reason%'
      - '&c🛠 &fᴋɪᴄᴋᴇᴅ ʙʏ &8→ &c%executor%'

  ipkick:
    message: '&c&l%player% &7ʜᴀs ʙᴇᴇɴ &c&lɪᴘ-ᴋɪᴄᴋᴇᴅ'
    broadcast_to_everyone: false
    permission: 'sxbans.admin.punishview.ipkick'
    hover:
      - '&c&lᴘʟᴀʏᴇʀ ɪᴘ ᴋɪᴄᴋᴇᴅ!'
      - '&c👤 &fᴘʟᴀʏᴇʀ &8→ &c%player%'
      - '&c✎ &fʀᴇᴀsᴏɴ &8→ &c%reason%'
      - '&c🛠 &fᴋɪᴄᴋᴇᴅ ʙʏ &8→ &c%executor%'

  warn:
    message: '&c&l%player% &7ʜᴀs ʀᴇᴄᴇɪᴠᴇᴅ ᴀ &c&lᴡᴀʀɴɪɴɢ'
    broadcast_to_everyone: false
    permission: 'sxbans.admin.punishview.warn'
    hover:
      - '&c&lᴘʟᴀʏᴇʀ ᴡᴀʀɴᴇᴅ!'
      - '&c👤 &fᴘʟᴀʏᴇʀ &8→ &c%player%'
      - '&c✎ &fʀᴇᴀsᴏɴ &8→ &c%reason%'
      - '&c⌚ &fᴇxᴘɪʀʏ &8→ &c%duration%'
      - '&c🛠 &fᴡᴀʀɴᴇᴅ ʙʏ &8→ &c%executor%'

  ipban:
    message: '&c&lɪᴘ %ip% &7ʜᴀs ʙᴇᴇɴ &c&lɪᴘ-ʙᴀɴɴᴇᴅ'
    broadcast_to_everyone: false
    permission: 'sxbans.admin.punishview.ipban'
    hover:
      - '&c&lɪᴘ ʙᴀɴɴᴇᴅ!'
      - '&c👤 &fᴘʟᴀʏᴇʀ &8→ &c%player%'
      - '&c✎ &fʀᴇᴀsᴏɴ &8→ &c%reason%'
      - '&c🛠 &fᴘᴜɴɪsʜᴇᴅ ʙʏ &8→ &c%executor%'

  ipunban:
    message: '&a&lɪᴘ %ip% &7ʜᴀs ʙᴇᴇɴ &a&lɪᴘ-ᴜɴʙᴀɴɴᴇᴅ'
    broadcast_to_everyone: true
    permission: 'sxbans.admin.punishview.ipunban'
    hover:
      - '&c&lɪᴘ ᴜɴ-ʙᴀɴɴᴇᴅ!'
      - '&c👤 &fᴘʟᴀʏᴇʀ &8→ &c%player%'
      - '&c✎ &fʀᴇᴀsᴏɴ &8→ &c%reason%'
      - '&c🛠 &fʀᴇᴠᴏᴋᴇᴅ ʙʏ &8→ &c%executor%'

  ipmute:
    message: '&c&lɪᴘ %ip% &7ʜᴀs ʙᴇᴇɴ &c&lɪᴘ-ᴍᴜᴛᴇᴅ'
    broadcast_to_everyone: false
    permission: 'sxbans.admin.punishview.ipmute'
    hover:
      - '&c&lɪᴘ ᴍᴜᴛᴇᴅ!'
      - '&c👤 &fᴘʟᴀʏᴇʀ &8→ &c%player%'
      - '&c✎ &fʀᴇᴀsᴏɴ &8→ &c%reason%'
      - '&c🛠 &fᴍᴜᴛᴇᴅ ʙʏ &8→ &c%executor%'

  ipunmute:
    message: '&a&lɪᴘ %ip% &7ʜᴀs ʙᴇᴇɴ &a&lɪᴘ-ᴜɴᴍᴜᴛᴇᴅ'
    broadcast_to_everyone: true
    permission: 'sxbans.admin.punishview.ipunmute'
    hover:
      - '&c&lɪᴘ ᴜɴ-ᴍᴜᴛᴇᴅ!'
      - '&c👤 &fᴘʟᴀʏᴇʀ &8→ &c%player%'
      - '&c✎ &fʀᴇᴀsᴏɴ &8→ &c%reason%'
      - '&c🛠 &fᴜɴᴍᴜᴛᴇᴅ ʙʏ &8→ &c%executor%'

# -------------------------------------------------------------------
# PUNISHMENT MESSAGES (shown to the player when punished)
# -------------------------------------------------------------------
punishment:
  ban:
    message: '&c&l❕ &c&lʏᴏᴜ''ʀᴇ ʙᴀɴɴᴇᴅ ꜰʀᴏᴍ ᴛʜᴇ sᴇʀᴠᴇʀ &c&l❕\n\n&c👤 &fᴜsᴇʀɴᴀᴍᴇ &8→ &c%player% &8←\n&c⌚ &fᴘᴜɴɪsʜᴇᴅ ᴏɴ &8→ &c%date% &8←\n&c🛠 &fᴘᴜɴɪsʜᴇᴅ ʙʏ &8→ &c%executor% &8←\n&c✎ &fʀᴇᴀsᴏɴ &8→ &c%reason% &8←\n\n&c📆 &fᴇxᴘɪʀʏ ᴅᴀᴛᴇ &8→ &c%expires% &8←\n&c⌛ &fᴇxᴘɪʀᴇs ɪɴ &8→ &c%duration% &8←'

  kick:
    message: '&c&l❕ &c&lʏᴏᴜ''ᴠᴇ ʙᴇᴇɴ ᴋɪᴄᴋᴇᴅ ꜰʀᴏᴍ ᴛʜᴇ sᴇʀᴠᴇʀ &c&l❕\n\n&c❌ &fᴋɪᴄᴋᴇᴅ ʙʏ &8→ &c%executor% &8←\n&c✎ &fʀᴇᴀsᴏɴ &8→ &c%reason% &8←'

  mute:
    message: '&c&l❕ &c&lʏᴏᴜ ʜᴀᴠᴇ ʙᴇᴇɴ ᴍᴜᴛᴇᴅ &c&l❕\n\n&c▪ &fᴍᴜᴛᴇᴅ ʙʏ &8→ &c%executor%\n&c▪ &fᴅᴜʀᴀᴛɪᴏɴ &8→ &c%duration%\n&c▪ &fʀᴇᴀsᴏɴ &8→ &c%reason%'

  warn:
    message: '&c&l❕ &c&lʏᴏᴜ ʜᴀᴠᴇ ʙᴇᴇɴ ᴡᴀʀɴᴇᴅ &c&l❕\n\n&c▪ &fᴡᴀʀɴᴇᴅ ʙʏ &8→ &c%executor%\n&c▪ &fᴇxᴘɪʀᴇs ɪɴ &8→ &c%duration%\n&c▪ &fʀᴇᴀsᴏɴ &8→ &c%reason%\n&c▪ &fᴀᴄᴛɪᴠᴇ ᴡᴀʀɴɪɴɢs &8→ &c%count%/%max%'

  ipban:
    message: '&c&l❕ &c&lʏᴏᴜʀ ʟᴏᴄᴀᴛɪᴏɴ ɪs ʙʟᴀᴄᴋʟɪsᴛᴇᴅ &c&l❕\n\n&c✎ &fʀᴇᴀsᴏɴ &8→ &c%reason% &8←'

  ipmute:
    message: '&c&l❕ &c&lʏᴏᴜʀ ɪᴘ ʜᴀs ʙᴇᴇɴ ᴍᴜᴛᴇᴅ &c&l❕\n\n&c▪ &fʀᴇᴀsᴏɴ &8→ &c%reason%'

  warning-count:
    message: '&eYou have &f%count%/%max% &ewarnings!'

  auto-unban:
    message: '&aYour ban has expired and you have been automatically unbanned!'

  auto-unmute:
    message: '&aYour mute has expired and you have been automatically unmuted!'

  expired:
    message: '&aYour &f%type% &ahas expired!'

  mute:
    filter: '&cYour message was blocked due to inappropriate language!'
    wildcard: '&cYou are muted due to your username containing restricted words!'

