# COMMAND MESSAGES
# -------------------------------------------------------------------
command:
  ban:
    usage: '&cUsᴀɢᴇ: &f/ban <ᴘʟᴀʏᴇʀ> <ʀᴇᴀsᴏɴ>'

  tempban:
    usage: '&cUsᴀɢᴇ: &f/tempban <ᴘʟᴀʏᴇʀ> <ᴛɪᴍᴇ> <ʀᴇᴀsᴏɴ>'

  unban:
    usage: '&cUsᴀɢᴇ: &f/unban <ᴘʟᴀʏᴇʀ>'

  mute:
    usage: '&cUsᴀɢᴇ: &f/mute <ᴘʟᴀʏᴇʀ> <ʀᴇᴀsᴏɴ>'

  tempmute:
    usage: '&cUsᴀɢᴇ: &f/tempmute <ᴘʟᴀʏᴇʀ> <ᴛɪᴍᴇ> <ʀᴇᴀsᴏɴ>'

  unmute:
    usage: '&cUsᴀɢᴇ: &f/unmute <ᴘʟᴀʏᴇʀ>'

  kick:
    usage: '&cUsᴀɢᴇ: &f/kick <ᴘʟᴀʏᴇʀ> <ʀᴇᴀsᴏɴ>'

  warn:
    usage: '&cUsᴀɢᴇ: &f/warn <ᴘʟᴀʏᴇʀ> <ʀᴇᴀsᴏɴ>'

  history:
    usage: '&cUsᴀɢᴇ: &f/history <ᴘʟᴀʏᴇʀ> [ᴘᴀɢᴇ]'

  check:
    usage: '&cUsᴀɢᴇ: &f/check <ᴘʟᴀʏᴇʀ>'

  ipban:
    usage: '&cUsᴀɢᴇ: &f/ipban <ᴘʟᴀʏᴇʀ/ɪᴘ> <ʀᴇᴀsᴏɴ>'

  ipunban:
    usage: '&cUsᴀɢᴇ: &f/ipunban <ɪᴘ>'

  ipmute:
    usage: '&cUsᴀɢᴇ: &f/ipmute <ᴘʟᴀʏᴇʀ/ɪᴘ> <ʀᴇᴀsᴏɴ>'

  ipunmute:
    usage: '&cUsᴀɢᴇ: &f/ipunmute <ɪᴘ>'

