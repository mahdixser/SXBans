# SX Bans Messages Configuration
# All messages are customizable with color codes (&)
# Support for hover messages with &h format

# -------------------------------------------------------------------
# BROADCAST MESSAGES WITH HOVER SUPPORT & PERMISSION
# -------------------------------------------------------------------
broadcast:
  ban:
    message: '&c%player% &7was banned by &c%executor%'
    broadcast_to_everyone: false
    permission: 'sxbans.admin.punishview.ban'
    hover:
      - '&6&l=== SXBans Punishment ==='
      - '&7Player: &f%player%'
      - '&7Executor: &f%executor%'
      - '&7Reason: &f%reason%'
      - '&7Duration: &f%duration%'
      - '&7Date: &f%date%'
      - '&7Server: &f%server%'
      - '&6&l========================'

  tempban:
    message: '&c%player% &7was temporarily banned by &c%executor% &7(%duration%)'
    broadcast_to_everyone: true
    permission: 'sxbans.admin.punishview.tempban'
