# -------------------------------------------------------------------
# STATS MESSAGES
# -------------------------------------------------------------------
stats:
  total-punishments: '&7Tᴏᴛᴀʟ Pᴜɴɪsʜᴍᴇɴᴛs: &f%count%'
  active-bans: '&7Aᴄᴛɪᴠᴇ Bᴀɴs: &f%count%'
  active-mutes: '&7Aᴄᴛɪᴠᴇ Mᴜᴛᴇs: &f%count%'
  total-warnings: '&7Tᴏᴛᴀʟ Wᴀʀɴɪɴɢs: &f%count%'
  web-status: '&7Wᴇʙ Sᴇʀᴠᴇʀ: %status%'
  database-type: '&7Dᴀᴛᴀʙᴀsᴇ: &f%type%'

# -------------------------------------------------------------------
# APPEAL MESSAGES
# -------------------------------------------------------------------
appeal:
  submitted: '&e%player% &7ʜᴀs sᴜʙᴍɪᴛᴛᴇᴅ ᴀ ʙᴀɴ ᴀᴘᴘᴇᴀʟ: &f%reason%'
