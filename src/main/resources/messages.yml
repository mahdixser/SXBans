    muted: '&e&lᴍᴜᴛᴇᴅ &7- Rᴇᴀsᴏɴ: &f%reason% &7- Bʏ: &f%executor% &7- &f%duration%'
    warnings: '&eWᴀʀɴɪɴɢs: &f%count%/%max%'
  ip: '&7ɪᴘ ᴀᴅᴅʀᴇss: &f%ip%'
  last-login: '&7Lᴀsᴛ sᴇᴇɴ: &f%time%'
  alt-accounts: '&eDᴇᴛᴇᴄᴛᴇᴅ &f%count% &eᴀʟᴛ ᴀᴄᴄᴏᴜɴᴛ(s) ᴏɴ ᴛʜɪs ɪᴘ!'

