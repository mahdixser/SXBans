  denied: '&cYᴏᴜʀ ʙᴀɴ ᴀᴘᴘᴇᴀʟ ʜᴀs ʙᴇᴇɴ ᴅᴇɴɪᴇᴅ! &7- &f%response%'
  closed: '&eYᴏᴜʀ ʙᴀɴ ᴀᴘᴘᴇᴀʟ ʜᴀs ʙᴇᴇɴ ᴄʟᴏsᴇᴅ.'

