  invalid-ip: '&cɪɴᴠᴀʟɪᴅ ɪᴘ ᴀᴅᴅʀᴇss ꜰᴏʀᴍᴀᴛ!'
  invalid-time: '&cɴᴏ ᴠᴀʟɪᴅ ᴛɪᴍᴇ sᴘᴇᴄɪꜰɪᴄᴀᴛɪᴏɴ ᴅᴇᴛᴇᴄᴛᴇᴅ! Usᴇ: 1s, 1m, 1h, 1d, 1w, 1M, 1y'
